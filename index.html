<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>챔피언스 선출 보드</title>
<meta name="description" content="포켓몬 챔피언스 싱글 배틀 선출 보드 — 상대 6마리를 고르면 내 파티에서 낼 3마리와 선봉을 계산합니다.">
<meta name="theme-color" content="#D8402F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23fff' stroke='%23161C2B' stroke-width='3'/%3E%3Cpath d='M2 16a14 14 0 0 1 28 0z' fill='%23D8402F' stroke='%23161C2B' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23fff' stroke='%23161C2B' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#F2F4F7; --panel:#FFFFFF; --ink:#161C2B; --muted:#5A6376; --line:#DCE1E9; --chip:#E9EDF3;
  --accent:#D8402F; --accent-ink:#FFFFFF; --focus:#2F5BEA;
  --good:#1E8E5A; --bad:#C23B30;
  --heat-good:30,142,90; --heat-bad:194,59,48;
  --display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#10141C; --panel:#181E29; --ink:#E8ECF3; --muted:#98A2B5; --line:#2A3242; --chip:#222A38;
    --accent:#F0604E; --accent-ink:#10141C; --focus:#7C9BFF;
    --good:#4CC38A; --bad:#F07068; --heat-good:76,195,138; --heat-bad:240,112,104;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#10141C; --panel:#181E29; --ink:#E8ECF3; --muted:#98A2B5; --line:#2A3242; --chip:#222A38;
  --accent:#F0604E; --accent-ink:#10141C; --focus:#7C9BFF;
  --good:#4CC38A; --bad:#F07068; --heat-good:76,195,138; --heat-bad:240,112,104;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 40px}
h1{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.01em;margin:0}
h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:14px}
header .src{font-size:12px}
.mine{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.mine .m{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;display:flex;align-items:center;gap:6px}
.mine .m small{color:var(--muted);font-size:11px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:900px){.grid2{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}.right{position:sticky;top:env(safe-area-inset-top,0px)}}

.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dots{display:inline-flex;gap:3px}

/* 상대 6칸 */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.slot{background:var(--panel);border:1.5px dashed var(--line);border-radius:10px;min-height:62px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px;position:relative;text-align:left;cursor:pointer}
.slot.filled{border-style:solid}
.slot .nm{font-weight:700;font-size:14px;line-height:1.25;padding-right:22px;word-break:keep-all;overflow-wrap:anywhere}
.slot .mg{font-size:11px;color:var(--muted)}
.slot .mg b{color:var(--ink);font-weight:500}
.slot .x{position:absolute;top:0;right:0;border:0;background:none;color:var(--muted);font-size:17px;line-height:1;padding:7px 8px;cursor:pointer}
@media (max-width:520px){.slot{padding:8px}.slot .nm{font-size:13px}}
.slot.empty{color:var(--muted);font-size:13px;align-items:center;cursor:default}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools input{flex:1 1 180px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;color:var(--ink)}
.btn{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px}
.hint{font-size:12px;color:var(--muted);margin:0 0 8px}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;max-height:460px;overflow:auto;padding:2px}
.types{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.ty{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 9px 3px 7px;font-size:12px;cursor:pointer}
.ty[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.ty.reset{color:var(--muted)}
.pk{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px;cursor:pointer;text-align:left;font-size:13px;line-height:1.2}
.pk .pn{display:flex;flex-direction:column;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.pk .w{font-size:11px;color:var(--muted)}
.pk[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.pk[aria-pressed="true"] .w{color:inherit;opacity:.7}

/* 결과 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.order{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:8px;margin-bottom:14px}
@media (max-width:520px){.order{grid-template-columns:1fr 1fr}.order .lead{grid-column:1 / -1}}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .pos{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.card .who{font-family:var(--display);font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.card .sub{font-size:12px;color:var(--muted)}
.card.lead{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card.lead .pos,.card.lead .sub{color:var(--accent-ink);opacity:.85}
.card.lead .who{font-size:30px}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-bottom:14px}
.stats b{font-family:var(--mono);font-weight:500}
.block{margin-top:16px}
.mix{display:flex;flex-direction:column;gap:5px;font-size:13px}
.mix .row{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--ink)}
.resp{width:100%;border-collapse:collapse;font-size:13px}
.resp td,.resp th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.resp th{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--chip);white-space:nowrap}
.tag.go{background:rgba(var(--heat-good),.16);color:var(--good)}
.tag.sw{background:rgba(var(--heat-bad),.14);color:var(--bad)}
.scroll{overflow-x:auto}
.heat{border-collapse:separate;border-spacing:3px;font-size:12px;min-width:460px}
.heat th{font-weight:500;color:var(--muted);font-size:11px;padding:2px 4px;text-align:center}
.heat th.rh{text-align:right;white-space:nowrap}
.heat td{text-align:center;border-radius:6px;padding:7px 2px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.heat td.pick{outline:2px solid var(--ink);outline-offset:-2px}
.legend{font-size:11px;color:var(--muted);margin-top:6px}
.empty-state{color:var(--muted);font-size:14px;padding:24px 4px}
.ex{font-size:11px;background:var(--chip);border-radius:999px;padding:2px 8px;color:var(--muted)}
.jump{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px 14px;border:0;font:inherit;font-size:14px;text-align:left;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.jump[hidden]{display:none}
.jump b{font-family:var(--display);font-weight:400;font-size:17px}
.jump .go{margin-left:auto;font-size:12px;white-space:nowrap;opacity:.9}
.jump .ord{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:900px){.jump{display:none}}
@media (max-width:520px){.tools input{flex-basis:100%}.tools .btn{flex:1 1 0}}
@media (prefers-reduced-motion:no-preference){.card,.pk,.slot{transition:background .12s,border-color .12s}html{scroll-behavior:smooth}}
</style>

<div class="wrap">
  <header>
    <h1>챔피언스 선출 보드</h1>
    <span class="src muted" id="src"></span>
  </header>
  <div class="mine" id="mine" aria-label="내 파티"></div>

  <div class="grid2">
    <section aria-labelledby="h-opp">
      <h2 id="h-opp">상대 파티 <span id="exTag" class="ex" hidden>예시</span></h2>
      <div class="slots" id="slots"></div>
      <div class="tools">
        <input id="q" type="search" placeholder="이름 또는 타입 (예: 보만다, 메가, 페어리)" autocomplete="off">
        <button class="btn" id="clear" type="button">비우기</button>
        <button class="btn" id="sample" type="button">예시</button>
        <button class="btn" id="share" type="button" title="지금 고른 상대 파티를 링크로 복사">공유</button>
      </div>
      <div class="types" id="types" role="group" aria-label="타입으로 거르기"></div>
      <p class="hint"><span id="count" class="num"></span> · 누르면 추가·빼기. 타입을 두 개 고르면 두 타입을 모두 가진 포켓몬만 보입니다. 메가가 가능한 칸을 누르면 <b>자동(확률) → 메가 확정 → 메가 아님</b> 순서로 바뀝니다. 목록 순서 = 조우 비중.</p>
      <div class="pool" id="pool" role="list"></div>
    </section>

    <section class="right" aria-labelledby="h-res">
      <div class="panel">
        <h2 id="h-res">추천 선출</h2>
        <div id="result"></div>
      </div>
    </section>
  </div>
</div>
<button class="jump" id="jump" type="button" hidden></button>

function solve(M){
  const m = M.length, n = M[0].length;
  let lo = -Infinity, hi = Infinity, li = 0, hj = 0;
  for (let i=0;i<m;i++){ const r = Math.min(...M[i]); if (r > lo){lo = r; li = i;} }
  for (let j=0;j<n;j++){ let c = -Infinity; for (let i=0;i<m;i++) c = Math.max(c, M[i][j]); if (c < hi){hi = c; hj = j;} }
  if (hi - lo <= 1e-12){ const x = Array(m).fill(0), y = Array(n).fill(0); x[li]=1; y[hj]=1; return {v:lo,x,y}; }
  let mn = Infinity; for (const r of M) for (const v of r) mn = Math.min(mn, v);
  const shift = 1 - mn, W = n + m + 1;
  const T = Array.from({length:m+1}, () => new Float64Array(W));
  for (let i=0;i<m;i++){ for (let j=0;j<n;j++) T[i][j] = M[i][j] + shift; T[i][n+i] = 1; T[i][W-1] = 1; }
  for (let j=0;j<n;j++) T[m][j] = -1;
  const basis = Array.from({length:m}, (_, i) => n + i);
  for (let it=0; it<2000; it++){
    let c = -1; for (let j=0;j<W-1;j++) if (T[m][j] < -1e-12){ c = j; break; }
    if (c < 0) break;
    let r = -1, best = Infinity;
    for (let i=0;i<m;i++) if (T[i][c] > 1e-12){ const q = T[i][W-1] / T[i][c]; if (q < best){best = q; r = i;} }
    if (r < 0) break;
    const pv = T[r][c]; for (let j=0;j<W;j++) T[r][j] /= pv;
    for (let i=0;i<=m;i++) if (i !== r && T[i][c] !== 0){ const f = T[i][c]; for (let j=0;j<W;j++) T[i][j] -= f * T[r][j]; }
    basis[r] = c;
  }
  const s = T[m][W-1];
  const y = Array(n).fill(0); basis.forEach((b, i) => { if (b < n) y[b] = T[i][W-1] / s; });
  const x = Array.from({length:m}, (_, i) => T[m][n+i] / s);
  const sx = x.reduce((a,b)=>a+b,0), sy = y.reduce((a,b)=>a+b,0);
  return {v: 1/s - shift, x: x.map(v=>v/sx), y: y.map(v=>v/sy)};
}
function combos(n, k){ const out = []; const rec = (s, a) => { if (a.length === k){ out.push(a.slice()); return; } for (let i=s;i<n;i++){ a.push(i); rec(i+1, a); a.pop(); } }; rec(0, []); return out; }

// 상대가 스톤을 든 조합(pick.py stone_sets 와 같다): 스톤 수 분포 K(레플리카 팀: 없음·1개·2개)와
// 종별 스톤 채용률의 오즈로 조합 확률을 정한다. 메가 확정 칸이 있으면 그 한 마리만.
function stoneSets(){
  // 스톤 수 분포: 팀 안 메가 가능 종 수별(pick.py stone_count_dist), 없으면 전체
  const KD = DATA.meta.K || {all: [0.08, 0.16, 0.76]};
  const nC = Math.min(4, slots.filter(s => BY[s.k].pm !== undefined && BY[s.k].mv).length);
  const K = Array.isArray(KD) ? KD : (KD[String(nC)] || KD.all);
  const fm = slots.map(s => s.mode === "mega" && BY[s.k].pm !== undefined && !!BY[s.k].mv);
  const anyF = fm.some(x => x);
  const pm = slots.map((s, j) => { const o = BY[s.k]; if (o.pm === undefined || !o.mv || s.mode === "base") return 0; if (anyF && !fm[j]) return 0; return fm[j] ? 1 : o.pm; });
  const cand = []; pm.forEach((p, j) => { if (p > 0) cand.push(j); });
  const must = cand.filter(j => fm[j]);
  const odds = j => { const q = Math.min(pm[j], 0.97); return q / (1 - q); };
  const out = [];
  K.forEach((pk, k) => {
    if (pk <= 0 || k > cand.length) return;
    const subs = combos(cand.length, k).map(c => c.map(i => cand[i])).filter(S => must.every(j => S.includes(j)));
    const ws = subs.map(S => S.reduce((a, j) => a * odds(j), 1)), t = ws.reduce((a, b) => a + b, 0);
    if (t > 0) subs.forEach((S, i) => { if (ws[i] > 0) out.push({p: pk * ws[i] / t, S}); });
  });
  if (!out.length) return [{p: 1, S: must}];
  const t = out.reduce((a, s) => a + s.p, 0);
  const kept = out.map(s => ({p: s.p / t, S: s.S})).filter(s => s.p > 1e-4);
  const t2 = kept.reduce((a, s) => a + s.p, 0);           // 버린 뒤 다시 정규화
  return kept.map(s => ({p: s.p / t2, S: s.S}));
}
// 칸별로 스톤을 들었을 확률(표시용)
function megaProbs(){
  const sc = stoneSets();
  return slots.map((_, j) => sc.reduce((a, s) => a + (s.S.includes(j) ? s.p : 0), 0));
}
function baseV(){ return ME.map((_, i) => slots.map(s => BY[s.k].v[i])); }
function megaV(c){ const V = baseV(); ME.forEach((_, i) => V[i][c] = BY[slots[c].k].mv[i]); return V; }
function matrix(){                                            // 표시용 기대 상성
  const p = megaProbs();
  return ME.map((_, i) => slots.map((s, j) => { const o = BY[s.k]; return o.mv ? (1 - p[j]) * o.v[i] + p[j] * o.mv[i] : o.v[i]; }));
}
// 베이지안 게임(game.py solve_bayes 와 같은 이중 오라클): 나는 유형을 모르고 상대는 알고 고른다
function solveBayes(Ps, ps){
  const m = Ps[0].length, T = Ps.length;
  const colVal = (x, P) => P[0].map((_, j) => x.reduce((a, xi, i) => a + xi * P[i][j], 0));
  const argmin = arr => arr.reduce((b, v, j) => v < arr[b] ? j : b, 0);
  let x = Array(m).fill(1 / m);
  const cols = [Ps.map(P => argmin(colVal(x, P)))];
  let g;
  for (let r = 0; r < 200; r++){
    const R = [...Array(m).keys()].map(i => cols.map(c => c.reduce((a, j, t) => a + ps[t] * Ps[t][i][j], 0)));
    g = solve(R); x = g.x;
    const br = Ps.map(P => argmin(colVal(x, P)));
    const vbr = Ps.reduce((a, P, t) => a + ps[t] * Math.min(...colVal(x, P)), 0);
    if (vbr >= g.v - 1e-9 || cols.some(c => c.every((j, t) => j === br[t]))) break;
    cols.push(br);
  }
  const ys = Ps.map((P, t) => { const d = Array(P[0].length).fill(0); cols.forEach((c, k) => d[c[t]] += g.y[k]); return d; });
  return {v: g.v, x, ys};
}

function analyze(){
  const sc = stoneSets(), n = ME.length, m = slots.length;

  const W = DATA.meta.agg || 0;

    let ans = 0; for (const j of b){ let mx = -9; for (const i of a) mx = Math.max(mx, V[i][j]); ans += mx; }
    let cnt = 0; for (const i of a){ let mnv = 9; for (const j of b) mnv = Math.min(mnv, V[i][j]); cnt += mnv; }
    return (1 - W) * mean + W * (0.5 * ans / b.length + 0.5 * cnt / a.length);
  }));

  }))), ps = sc.map(s => s.p);
  const g = solveBayes(Ps, ps);
  const V = matrix();
  const y = B.map((_, k) => g.ys.reduce((a, yt, t) => a + ps[t] * yt[k], 0));
  const order = A.map((_, k) => k).sort((a, b) => g.x[b] - g.x[a]);

  const fs = freq.reduce((a,b)=>a+b,0) || 1; for (let j=0;j<m;j++) freq[j] /= fs;
  const worst = k => Ps.reduce((a, P, t) => a + ps[t] * Math.min(...P[k]), 0);   // 이 조합의 보장값(유형 가중)
  // 한 조합만 낸다면 = 보장값이 가장 좋은 조합(pick.py 와 같다). 균형의 최다 조합은 '확률 최대'일 뿐이다.

  };
  const lp = leadGame(A[sk]);
  const pos = A[sk].slice().sort((a, b) => (lp[b] || 0) - (lp[a] || 0));     // ① 선봉 = 선봉 게임에서 비율이 가장 큰 쪽
  const mix = order.filter(k => g.x[k] > 0.01).map(k => { const q = leadGame(A[k]); return {t: A[k], p: g.x[k], lead: +Object.keys(q).reduce((b, i) => q[i] > q[b] ? i : b)}; });
  return {V, pos, v: g.v, safe: ws[sk], mix, their, freq, nsc: sc.length, lp};
}

// ── 그리기 ──
function renderMine(){
  $("#mine").innerHTML = ME.map(b => `<span class="m" title="${esc(b.item + ' | ' + b.nat + ' | ' + b.sp + ' | ' + b.mv.join(', '))}">${dots(b.t)} ${esc(b.n)} <small>${esc(b.a)} · ${esc(b.item)}</small></span>`).join("");
  $("#src").textContent = `시즌 ${DATA.meta.season} · op.gg 수집 ${DATA.meta.date} · 1:1 시뮬 + 실전 승패 · 3/6 선출 게임 균형`;
}
function modeText(s, pm){
  const o = BY[s.k];
  if (o.pm === undefined) return "";
  if (s.mode === "mega") return `<b>메가 확정</b>`;
  if (s.mode === "base") return `메가 아님`;
  return `자동 · 메가 ${Math.round(pm * 100)}%`;
}
function renderSlots(){
  const p = megaProbs();
  let h = "";
  for (let j=0;j<6;j++){
    const s = slots[j];
    if (!s){ h += `<div class="slot empty">${j+1}</div>`; continue; }
    const o = BY[s.k];
    const nm = s.mode === "mega" && o.mn ? o.mn : o.n;
    h += `<div class="slot filled" role="button" tabindex="0" data-j="${j}" title="${esc(o.set)}">
      <span class="nm">${dots(s.mode === "mega" && o.mt ? o.mt : o.t)} ${esc(nm)}</span>
      <span class="mg">${modeText(s, p[j])}</span>
      <button class="x" type="button" data-rm="${j}" aria-label="${esc(o.n)} 빼기">×</button></div>`;
  }
  $("#slots").innerHTML = h;
}
const TYPE_ORDER = ["normal","fire","water","electric","grass","ice","fighting","poison","ground","flying","psychic","bug","rock","ghost","dragon","dark","steel","fairy"];
let typeSel = [];
function renderTypes(){
  $("#types").innerHTML = TYPE_ORDER.filter(t => TYPES.n[t]).map(t => `<button class="ty" type="button" data-t="${t}" aria-pressed="${typeSel.includes(t)}"><span class="dot" style="background:${TYPES.c[t]}"></span>${esc(TYPES.n[t])}</button>`).join("")
    + (typeSel.length ? `<button class="ty reset" type="button" data-t="">타입 해제</button>` : "");
}
// 메가형 타입도 본다(예: 메가리자몽X 는 불꽃·드래곤)
const typesOf = o => new Set([...(o.t || []), ...(o.mt || [])]);
const TNAME = Object.fromEntries(Object.entries(TYPES.n).map(([k, v]) => [k, v]));
function renderPool(){
  const q = $("#q").value.trim().replace(/\s/g, "");
  const chosen = new Set(slots.map(s => s.k));
  const qType = Object.keys(TNAME).find(k => TNAME[k] === q);          // 검색어가 타입 이름이면 타입으로
  const list = OPPS.filter(o => {
    const ts = typesOf(o);
    if (typeSel.length && !typeSel.every(t => ts.has(t))) return false;
    if (!q) return true;
    if (qType) return ts.has(qType);
    return (o.full + (o.mn || "") + o.k).replace(/\s/g, "").includes(q);
  });
  $("#count").textContent = list.length === OPPS.length ? `전체 ${OPPS.length}종` : `${OPPS.length}종 중 ${list.length}종`;
  $("#pool").innerHTML = list.map(o => `<button class="pk" type="button" role="listitem" data-k="${o.k}" aria-pressed="${chosen.has(o.k)}" title="${esc(o.full + ' — ' + o.set)}">
    ${dots(o.t)}<span class="pn"><span>${esc(o.n)}</span>${o.w || o.pm !== undefined ? `<span class="w num">${[o.w ? o.w.toFixed(1) + '%' : '', o.pm !== undefined ? 'M' : ''].filter(Boolean).join(' · ')}</span>` : ''}</span></button>`).join("")
    || `<p class="muted">조건에 맞는 포켓몬이 없습니다${q ? ` ("${esc(q)}")` : ""}. 검색어나 타입을 줄여 보세요.</p>`;
}
function renderResult(){
  const el = $("#result");
  if (slots.length < 3){ el.innerHTML = `<p class="empty-state">상대 포켓몬을 3마리 이상 고르면 선출을 계산합니다. (지금 ${slots.length}마리)</p>`; return; }
  const r = analyze(), V = r.V;
  const name = i => ME[i].n, oname = j => { const s = slots[j], o = BY[s.k]; return s.mode === "mega" && o.mn ? o.mn : o.n; };
  const labels = ["① 선봉", "② 대기", "③ 대기"];
  const lpct = i => r.lp[i] !== undefined && r.lp[i] < 0.995 ? ` · 선봉 ${Math.round(r.lp[i] * 100)}%` : "";
  const cards = r.pos.map((i, k) => {
    const good = [...Array(slots.length).keys()].filter(j => V[i][j] >= 0.3).map(oname);
    return `<div class="card ${k===0?'lead':''}"><span class="pos">${labels[k]}</span><span class="who">${esc(name(i))}</span>
      <span class="sub">${esc(ME[i].item)}${lpct(i)}${good.length ? ' · 유리: ' + esc(good.slice(0,3).join(', ')) : ''}</span></div>`;
  }).join("");
  const mix = r.mix.length > 1 ? `<div class="block"><h2>섞어 낼 때 비율 (균형 — 읽히지 않게)</h2><div class="mix">${r.mix.map(x => `<div class="row"><div>${esc(x.t.map(name).join(' / '))} <span class="muted">· 선봉 ${esc(name(x.lead))}</span><div class="bar"><i style="width:${(x.p*100).toFixed(0)}%"></i></div></div><span class="num">${(x.p*100).toFixed(0)}%</span></div>`).join("")}</div>
    <p class="legend">한 조합만 고집하면 읽힙니다. 1순위가 위 카드입니다.</p></div>` : "";
  const their = `<div class="block"><h2>상대가 낼 3마리 (예상)</h2><div class="mix">${r.their.slice(0,3).map(x => `<div class="row"><div>${esc(x.t.map(oname).join(' / '))}<div class="bar"><i style="width:${(x.p*100).toFixed(0)}%"></i></div></div><span class="num">${(x.p*100).toFixed(0)}%</span></div>`).join("")}</div></div>`;
  const lead = r.pos[0];
  const respRows = [...Array(slots.length).keys()].sort((a, b) => r.freq[b] - r.freq[a]).map(j => {
    const bi = r.pos.reduce((b, i) => V[i][j] > V[b][j] ? i : b, r.pos[0]);
    const stay = V[lead][j] >= 0 || bi === lead;
    const act = stay ? `<span class="tag go">선봉 그대로</span>` : `<span class="tag sw">${esc(name(bi))}로 교체</span>`;
    return `<tr><td>${esc(oname(j))}</td><td class="num muted">${Math.round(r.freq[j]*100)}%</td><td class="num">${fmt(V[lead][j])}</td><td>${act} <span class="num muted">${fmt(V[bi][j])}</span></td></tr>`;
  }).join("");
  const resp = `<div class="block"><h2>상대 선봉별 대응</h2><div class="scroll"><table class="resp"><thead><tr><th>상대가 먼저 내면</th><th>선출 확률</th><th>선봉 상성</th><th>대응</th></tr></thead><tbody>${respRows}</tbody></table></div></div>`;
  const cs = getComputedStyle(document.documentElement);
  const G = cs.getPropertyValue("--heat-good").trim(), Bd = cs.getPropertyValue("--heat-bad").trim();
  const cell = (v, pick) => `<td class="${pick?'pick':''}" style="background:rgba(${v>=0?G:Bd},${Math.min(1, Math.abs(v)) * 0.55 + 0.05})">${fmt(v)}</td>`;
  const heat = `<div class="block"><h2>상성표 (나 → 상대)</h2><div class="scroll"><table class="heat"><thead><tr><th></th>${slots.map((s, j) => `<th title="${esc(BY[s.k].set)}">${esc(oname(j))}</th>`).join("")}</tr></thead><tbody>
    ${ME.map((_, i) => `<tr><th class="rh">${esc(name(i))}</th>${slots.map((_, j) => cell(V[i][j], r.pos.includes(i))).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="legend">+1 = 만피로 이김 · 0 = 비등 · −1 = 못 건드리고 짐. 굵은 테두리 = 추천 3마리. 상대 이름에 마우스를 올리면 세트가 보입니다.</p></div>`;
  $("#jump").innerHTML = `<span class="ord">${r.pos.map((i, k) => k ? esc(name(i)) : `<b>${esc(name(i))}</b>`).join(" · ")}</span><span class="go">결과 보기 ↓</span>`;
  el.innerHTML = `<div class="order">${cards}</div>
    <div class="stats"><span>이 조합의 보장값 <b>${fmt(r.safe)}</b></span><span>섞어 낼 때 게임 값 <b>${fmt(r.v)}</b></span>${r.nsc > 1 ? `<span class="muted">상대가 스톤을 든 조합 ${r.nsc}가지(1~2마리)를 상대만 아는 게임으로 계산</span>` : ""}<span class="muted">비교용 점수(순위·차이만 의미 있음)이며 승률이 아닙니다</span></div>
    ${mix}${their}${resp}${heat}`;
}
// 주소 #v=키,키*,키! (* = 메가 확정, ! = 메가 아님) — 링크로 같은 상대를 공유
const MARK = {mega: "*", base: "!", auto: ""};
const toHash = () => slots.length ? "#v=" + slots.map(s => s.k + MARK[s.mode]).join(",") : "";
function fromHash(){
  const m = location.hash.match(/^#v=([^&]*)/); if (!m) return null;
  const out = [];
  for (const t of decodeURIComponent(m[1]).split(",")){
    const k = t.replace(/[*!]$/, ""); if (!BY[k] || out.some(s => s.k === k)) continue;
    out.push({k, mode: t.endsWith("*") && BY[k].pm !== undefined ? "mega" : t.endsWith("!") ? "base" : "auto"});
  }
  let seen = false; out.forEach(s => { if (s.mode === "mega"){ if (seen) s.mode = "auto"; seen = true; } });
  return out.length ? out.slice(0, 6) : null;
}
function save(){
  try { localStorage.setItem(STORE, JSON.stringify(slots)); } catch (e) {}
  try { history.replaceState(null, "", location.pathname + location.search + toHash()); } catch (e) {}
}
let resVisible = false;
const updateJump = () => { $("#jump").hidden = slots.length < 3 || resVisible; };
function render(){ renderSlots(); renderPool(); renderResult(); save(); updateJump(); }

function toggle(k){
  const i = slots.findIndex(s => s.k === k);
  if (i >= 0) slots.splice(i, 1); else if (slots.length < 6) slots.push({k, mode:"auto"});
  $("#exTag").hidden = true; render();
}
$("#pool").addEventListener("click", e => { const b = e.target.closest(".pk"); if (b) toggle(b.dataset.k); });
$("#slots").addEventListener("click", e => {
  const rm = e.target.closest("[data-rm]");
  if (rm){ slots.splice(+rm.dataset.rm, 1); $("#exTag").hidden = true; render(); return; }
  const s = e.target.closest(".slot.filled"); if (!s) return;
  const sl = slots[+s.dataset.j]; if (BY[sl.k].pm === undefined) return;
  sl.mode = {auto:"mega", mega:"base", base:"auto"}[sl.mode];
  if (sl.mode === "mega") slots.forEach(o => { if (o !== sl && o.mode === "mega") o.mode = "auto"; });   // 메가는 한 팀에 1회
  render();
});
$("#slots").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("slot")){ e.preventDefault(); e.target.click(); } });
$("#q").addEventListener("input", renderPool);
$("#types").addEventListener("click", e => {
  const b = e.target.closest(".ty"); if (!b) return;
  const t = b.dataset.t;
  if (!t) typeSel = [];
  else if (typeSel.includes(t)) typeSel = typeSel.filter(x => x !== t);
  else typeSel = [...typeSel, t].slice(-2);          // 최대 2개(복합 타입)
  renderTypes(); renderPool();
});
$("#q").addEventListener("keydown", e => { if (e.key === "Enter"){ const b = $("#pool .pk"); if (b){ toggle(b.dataset.k); $("#q").value = ""; renderPool(); } } });
$("#clear").addEventListener("click", () => { slots = []; $("#exTag").hidden = true; render(); });
function sample(){ slots = OPPS.slice(0, 6).map(o => ({k: o.k, mode: "auto"})); $("#exTag").hidden = false; render(); }
$("#sample").addEventListener("click", sample);
$("#jump").addEventListener("click", () => $(".right .panel").scrollIntoView({block: "start"}));
$("#share").addEventListener("click", async () => {
  const b = $("#share"), url = location.href;
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; } catch (e) {}
  if (!ok) window.prompt("이 링크를 복사하세요", url);
  else { b.textContent = "복사됨"; setTimeout(() => { b.textContent = "공유"; }, 1500); }
});
window.addEventListener("hashchange", () => { const h = fromHash(); if (h){ slots = h; $("#exTag").hidden = true; render(); } });
if ("IntersectionObserver" in window)
  new IntersectionObserver(es => { resVisible = es[0].isIntersecting; updateJump(); }, {rootMargin: "0px 0px -35% 0px"}).observe($(".right .panel"));

renderMine();
renderTypes();
const fromLink = fromHash();
if (fromLink) slots = fromLink;
else try { const s = JSON.parse(localStorage.getItem(STORE) || "null"); if (Array.isArray(s) && s.length && s.every(x => BY[x.k])) slots = s; } catch (e) {}
if (!slots.length) sample(); else render();
</script>
